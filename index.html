<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        transition: all 0.1s ease-in;
        font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
       box-sizing: border-box;}
        body {
          
        margin: 0;
        }
         h1, p { margin: 0; padding: 0; }
      
    </style>

    <title>Weather Forecast</title>
  </head>
  <body class="bg-gray-100">
    <div
      class="w-[1440px] mx-auto bg-[#39c] border-[25px] border-[#2b81ac] py-[60px] px-[113px] text-center h-full "
    >
      <h1 class="text-left text-white text-4xl mb-[35px] ">
        CSS Weather Forecast <i class="wi wi-sunrise text-5xl "></i>
      </h1>
<div class="text-[0] text-left wrap-nowrap m-auto">
    
          <div
            class="w-[50%]  border-[2px] border-[#fff] h-full text-center py-[26px]  align-top  bg-[#2b81ac] inline-block"
          >

            <p class="text-center text-white text-[21px]">

            </p>
          </div>

          </div>

           <div

            <p class="text-center text-white text-[21px]">

            </p>

           <div

           <div

            <p class="text-center text-white text-[21px]">

          </div>

           <div
            class="w-[25%]  border-[2px] border-[#fff] h-full text-center py-[26px] inline-block align-top  bg-[#fc6] "

          </div>

           <div

            </p>
          </div>

           <div
            class="w-full border-[2px] border-[#fff] h-full text-center py-[26px] inline-block align-top  bg-[#669] "
          >
            <p class="text-center text-white text-[21px]">Sydney</p>
            <p class="text-center text-white text-[21px]">
              25°C <i class="wi wi-night-cloudy-high text-4xl align-middle pl-1 "></i>
            </p>
          </div>
</div>

<p class="text-left text-white text-[16px] mt-[35px] ">Have a nice day and don't forget umbrella if you are in New Delhi now!</p>


    </div>
  </body>
</html>
